---
# Credential Analysis Workflow - configurable by admin
# Defines how transcript/credential data is extracted and matched to opportunities

credentialTypes:
  - CollegeTranscript
  - HighSchoolTranscript
  - Diploma
  - StudentCard

extraction:
  includeProgram: true
  includeGpa: true
  includeCourses: true
  maxCourses: 20

matching:
  matchFields:
    - industry
    - occupation
    - educationRequirements
  minScore: 0.2

enabled: true
